<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic OCR API 테스터</title>
<style>
  :root{
    --ground:#f4f6f8; --surface:#ffffff; --ink:#1b2431; --muted:#647082;
    --line:#dbe1ea; --sub:#eef2f7; --accent:#2563eb;
    --get:#0f766e; --post:#7c3aed;
    --ok:#0f766e; --warn:#b45309; --err:#be123c; --neutral:#64748b;
    --mono:"JetBrains Mono","Consolas","D2Coding",ui-monospace,monospace;
    --sans:"Pretendard","맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ground:#0d1218; --surface:#151c25; --ink:#e6ebf2; --muted:#93a2b4;
      --line:#293441; --sub:#1a222d; --accent:#6ba1ff;
      --get:#4cc7b8; --post:#b18cff;
      --ok:#4cc7b8; --warn:#e0a154; --err:#f4708c; --neutral:#8b98a8;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.5;}
  .app{display:flex;min-height:100vh;}
  .sidebar{width:264px;flex:none;background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;}
  .brand{padding:18px 18px 12px;border-bottom:1px solid var(--line);}
  .brand h1{font-size:15px;margin:0;letter-spacing:-.01em;}
  .brand p{font-size:11.5px;color:var(--muted);margin:3px 0 0;}
  .nav-group{padding:14px 12px 2px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;}
  .nav-item{display:flex;align-items:center;gap:9px;padding:9px 12px;margin:1px 8px;border-radius:8px;cursor:pointer;font-size:13px;}
  .nav-item:hover{background:var(--sub);}
  .nav-item.active{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-weight:600;}
  .m{font-family:var(--mono);font-size:9.5px;font-weight:700;padding:2px 5px;border-radius:5px;color:#fff;flex:none;letter-spacing:.03em;}
  .m-GET{background:var(--get);} .m-POST{background:var(--post);}
  main{flex:1;min-width:0;}
  .conn{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 24px;position:sticky;top:0;z-index:5;display:flex;gap:20px;align-items:center;flex-wrap:wrap;font-size:12.5px;}
  .conn .env{color:var(--muted);}
  .conn .env b{color:var(--ink);font-family:var(--mono);}
  .conn .cb{display:flex;align-items:center;gap:8px;}
  .conn .cb code{font-family:var(--mono);font-size:12px;background:var(--sub);border:1px solid var(--line);border-radius:6px;padding:4px 8px;color:var(--ink);}
  .mini{font-size:12px;font-weight:600;padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;}
  .mini:hover{background:var(--sub);}
  .detail{max-width:820px;padding:26px 24px 90px;}
  .d-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .d-head .m{font-size:11px;padding:3px 8px;}
  .d-head h2{font-size:20px;margin:0;letter-spacing:-.01em;}
  .d-path{font-family:var(--mono);font-size:14px;color:var(--ink);background:var(--sub);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:12px 0;word-break:break-all;}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .tag{font-size:11px;font-family:var(--mono);padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--muted);}
  .tag b{color:var(--ink);}
  .desc{font-size:14px;color:var(--muted);margin:0 0 4px;max-width:64ch;}
  .sec{margin-top:24px;}
  .sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:700;}
  table{border-collapse:collapse;width:100%;font-size:13px;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--sub);font-weight:600;}
  tr:last-child td{border-bottom:none;}
  td.k{font-family:var(--mono);font-size:12px;white-space:nowrap;}
  td .pi{width:100%;font-family:var(--mono);font-size:12.5px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--ground);color:var(--ink);}
  .req{color:var(--err);font-weight:700;} .opt{color:var(--muted);}
  .type{font-family:var(--mono);font-size:11.5px;color:var(--accent);}
  textarea{width:100%;font-family:var(--mono);font-size:12.5px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--ground);color:var(--ink);min-height:150px;resize:vertical;line-height:1.5;}
  .hdrs{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--sub);border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
  .hdrs b{color:var(--ink);}
  .file{font-size:12px;color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .actions{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;}
  button.call{background:var(--accent);color:#fff;font-family:var(--sans);font-size:13.5px;font-weight:600;padding:10px 18px;border-radius:8px;border:1px solid transparent;cursor:pointer;}
  button.call:hover{filter:brightness(1.06);} button.call:disabled{opacity:.5;cursor:default;}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-family:var(--sans);font-size:13.5px;font-weight:600;padding:10px 18px;border-radius:8px;cursor:pointer;}
  button.ghost:hover{background:var(--sub);}
  .resp{margin-top:26px;border-top:1px dashed var(--line);padding-top:20px;}
  .status{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:13px;margin-bottom:10px;flex-wrap:wrap;}
  .pill{padding:3px 10px;border-radius:20px;font-weight:700;font-size:12px;color:#fff;}
  .s-ok{background:var(--ok);} .s-warn{background:var(--warn);} .s-err{background:var(--err);} .s-neutral{background:var(--neutral);}
  .meta{color:var(--muted);}
  pre{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow:auto;font-family:var(--mono);font-size:12.5px;margin:0;max-height:460px;}
  .rh{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin:8px 0 0;word-break:break-all;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;}
  .toast.show{opacity:1;}
  @media(max-width:780px){ .app{flex-direction:column;} .sidebar{width:100%;height:auto;position:static;} }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><h1>Agentic OCR API</h1><p>외부 연동 10종 · Vercel 프록시 경유</p></div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <div class="conn">
      <span class="env">요청은 <b>/api/proxy</b> 경유 · Base URL·토큰은 서버 환경변수</span>
      <span class="cb">콜백 URL <code id="cbUrl">…/api/callback</code>
        <button class="mini" id="cbCopy">복사</button></span>
    </div>
    <div class="detail" id="detail"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const CALLBACK = location.origin + "/api/callback";

const ENDPOINTS = [
  { group:"트랜잭션", name:"트랜잭션 제출", method:"POST", path:"/v1/transactions",
    scope:"workflow:execute", success:"202",
    desc:"문서 1건 이상을 제출해 처리를 시작합니다. 1회 제출 = 1 트랜잭션이며, 파일은 base64로 본문에 담습니다.",
    bodyFields:[
      {k:"workflow_id", t:"string", req:true, d:"처리에 사용할 활성 워크플로우 식별자"},
      {k:"documents", t:"array", req:true, d:"제출 문서 목록(1건 이상)"},
      {k:"documents[].filename", t:"string", req:true, d:"원본 파일명. 결과의 document_name으로 반환"},
      {k:"documents[].format", t:"enum", req:true, d:"pdf | image | hwp | office"},
      {k:"documents[].data", t:"base64", req:true, d:"문서 바이트의 base64 (≤50MB, ≤200p)"},
      {k:"client_transaction_no", t:"string", req:false, d:"고객 원장 번호. 멱등 대용(재제출 409)"},
      {k:"callback_url", t:"string", req:false, d:"결과 콜백 주소. http·https만 허용"},
    ],
    body:{ workflow_id:"019fb63d-1c2a-7f01-9c8e-5b1d0f9a2e44", client_transaction_no:"CLM-2026-000123",
           callback_url:CALLBACK,
           documents:[ { filename:"sample.pdf", format:"pdf", data:"JVBERi0xLjQK..." } ] },
    fileTarget:true,
    sample:{ status:202, body:{ transaction_id:"019fb646-5a20-7835-9250-70e50a6f16c5", status:"running", client_transaction_no:"CLM-2026-000123" } } },

  { group:"트랜잭션", name:"트랜잭션 상태 조회", method:"GET", path:"/v1/transactions/{transaction_id}",
    scope:"workflow:result", success:"200",
    desc:"트랜잭션의 진행 상태와 문서별 집계를 조회합니다. 완료 판정에 쓰는 폴링 대상 API입니다.",
    pathParams:[ {k:"transaction_id", d:"제출 응답에서 받은 트랜잭션 식별자"} ],
    sample:{ status:200, body:{ transaction_id:"019fb646-5a20-7835-9250-70e50a6f16c5", status:"completed",
      validation_status:"pass", file_count:1,
      counts:{ succeeded:1, failed:0, canceled:0, pass:1, needs_review:0, rejected:0, corrected:0, rejected_final:0 },
      plugin_status:"done", callback_ready:true } } },

  { group:"트랜잭션", name:"트랜잭션 결과 조회", method:"GET", path:"/v1/transactions/{transaction_id}/result",
    scope:"workflow:result", success:"200",
    desc:"문서별 추출 필드 값과 검증 결과를 조회합니다. status가 completed/partially_completed일 때만 값이 채워집니다.",
    pathParams:[ {k:"transaction_id", d:"제출 응답에서 받은 트랜잭션 식별자"} ],
    sample:{ status:200, body:{ transaction_id:"019fb646-5a20-7835-9250-70e50a6f16c5",
      workflow_id:"019fb63d-1c2a-7f01-9c8e-5b1d0f9a2e44", status:"completed", client_transaction_no:"CLM-2026-000123",
      documents:[ { document_id:"019fb646-5a22-7c10-b0a1-9f2e4d7c8a31", status:"pass",
        doc_type:"진단서", doc_type_code:"DIAGNOSIS",
        extracted_fields:[
          { key:"patient_name", field_code:"PATIENT_NAME", confidence:0.986, value:"홍길동", masked_value:"홍*동" },
          { key:"kcd_code", field_code:"KCD_CODE", confidence:0.941, value:"S33.5", masked_value:null } ],
        extracted_tables:[], extracted_groups:[], confidence_summary:{ mean:0.963, min:0.941 } } ],
      meta:{ processed_at:"2026-09-14T03:41:07Z", file_count:1 } } } },

  { group:"트랜잭션", name:"트랜잭션 취소", method:"POST", path:"/v1/transactions/{transaction_id}:cancel",
    scope:"workflow:execute", success:"200",
    desc:"아직 시작되지 않은 처리를 취소합니다. 협조적 취소이며 멱등입니다(경로 끝은 :cancel).",
    pathParams:[ {k:"transaction_id", d:"취소할 트랜잭션 식별자"} ],
    sample:{ status:200, body:{ transaction_id:"019fb646-5a20-7835-9250-70e50a6f16c5", status:"canceled",
      counts:{ succeeded:0, failed:0, canceled:1 } } } },

  { group:"워크플로우", name:"워크플로우 목록", method:"GET", path:"/v1/workflows",
    scope:"workflow:read", success:"200",
    desc:"제출 대상으로 지정할 수 있는 워크플로우 목록을 조회합니다. active만 반환됩니다.",
    query:[ {k:"status", v:"active", d:"active만 허용(다른 값은 400)"}, {k:"page", v:"1", d:"페이지 번호"}, {k:"page_size", v:"20", d:"1~100"} ],
    sample:{ status:200, body:{ items:[ { workflow_id:"019fb63d-1c2a-7f01-9c8e-5b1d0f9a2e44", name:"진단서 추출",
      description:"보험 청구용", doc_type:"진단서", status:"active",
      active_release_id:"019fb63d-2f70-71aa-8d31-6c0b7e2f9a10", activated_at:"2026-09-01T05:12:33Z" } ],
      page:1, page_size:20, total:1 } } },

  { group:"워크플로우", name:"워크플로우 상세", method:"GET", path:"/v1/workflows/{workflow_id}",
    scope:"workflow:read", success:"200",
    desc:"워크플로우 1건의 상세를 조회합니다(목록과 동일한 7필드).",
    pathParams:[ {k:"workflow_id", d:"목록에서 받은 워크플로우 식별자"} ],
    sample:{ status:200, body:{ workflow_id:"019fb63d-1c2a-7f01-9c8e-5b1d0f9a2e44", name:"진단서 추출",
      description:"보험 청구용", doc_type:"진단서", status:"active",
      active_release_id:"019fb63d-2f70-71aa-8d31-6c0b7e2f9a10", activated_at:"2026-09-01T05:12:33Z" } } },

  { group:"라이브러리", name:"Library Agent 목록", method:"GET", path:"/v1/library/agents",
    scope:"library:read", success:"200",
    desc:"워크플로우 구성에 쓰이는 Agent 정의 목록을 조회합니다.",
    query:[ {k:"skill_type", v:"", d:"parse|classify|extract|validate|redact"}, {k:"q", v:"", d:"이름 검색어"}, {k:"page", v:"1", d:"페이지"}, {k:"page_size", v:"20", d:"1~100"} ],
    sample:{ status:200, body:{ items:[ { agent_id:"019fb700-aa01-7c33-9d10-1a2b3c4d5e6f", name:"진단서 추출기",
      skill_type:"extract", doc_type_tags:["진단서"], created_at:"2026-08-20T00:00:00Z" } ], page:1, page_size:20, total:1 } } },

  { group:"라이브러리", name:"Library Agent 상세", method:"GET", path:"/v1/library/agents/{agent_id}",
    scope:"library:read", success:"200",
    desc:"Agent 1건의 상세와 정의 본문(처리 단계 정의)을 조회합니다.",
    pathParams:[ {k:"agent_id", d:"목록에서 받은 Agent 식별자"} ],
    sample:{ status:200, body:{ agent_id:"019fb700-aa01-7c33-9d10-1a2b3c4d5e6f", name:"진단서 추출기",
      skill_type:"extract", doc_type_tags:["진단서"], description:"진단서 필드 추출",
      workflow_step:{ type:"extract", fields:[ {key:"patient_name"}, {key:"kcd_code"} ] } } } },

  { group:"스키마 추천", name:"스키마 추천 제출", method:"POST", path:"/v1/schema-suggestions",
    scope:"schema:suggest", success:"202",
    desc:"문서 여러 건을 올려 분류 클래스 후보와 클래스별 추출 스키마 제안을 받습니다(비동기).",
    bodyFields:[
      {k:"documents", t:"array", req:true, d:"제출 문서 배열(1~10건)"},
      {k:"documents[].filename", t:"string", req:true, d:"원본 파일명"},
      {k:"documents[].format", t:"enum", req:true, d:"pdf | image | hwp | office"},
      {k:"documents[].data", t:"base64", req:true, d:"문서 바이트의 base64"},
    ],
    body:{ documents:[ { filename:"sample.pdf", format:"pdf", data:"JVBERi0xLjQK..." } ] },
    fileTarget:true,
    sample:{ status:202, body:{ suggestion_id:"019fb700-1c2a-7f01-9c8e-5b1d0f9a2e44", status:"pending", poll_after_ms:3000 } } },

  { group:"스키마 추천", name:"스키마 추천 결과 조회", method:"GET", path:"/v1/schema-suggestions/{suggestion_id}",
    scope:"schema:suggest", success:"200",
    desc:"추천 산출을 조회합니다. 종결 후 10분간만 보관됩니다.",
    pathParams:[ {k:"suggestion_id", d:"제출 응답에서 받은 식별자"} ],
    sample:{ status:200, body:{ suggestion_id:"019fb700-1c2a-7f01-9c8e-5b1d0f9a2e44", status:"succeeded",
      results:[ { classify_schema:{ class_name:"진단서", class_description:"병명·KCD코드가 있는 의료 증빙" },
        extract_schema:{ fields:[ {key:"병명"}, {key:"질병분류기호"} ], groups:[] } } ], error:null, poll_after_ms:null } } },
];

const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const detail=$("#detail"), nav=$("#nav");
$("#cbUrl").textContent = CALLBACK;
$("#cbCopy").onclick = ()=>navigator.clipboard.writeText(CALLBACK).then(()=>toast("콜백 URL 복사됨"));

let selected = 0;
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function pathParams(p){ return [...p.matchAll(/\{(\w+)\}/g)].map(m=>m[1]); }
function fmtGuess(name){ const e=(name.split(".").pop()||"").toLowerCase();
  if(e==="pdf")return"pdf"; if(["jpg","jpeg","png","tif","tiff","gif","webp"].includes(e))return"image";
  if(["hwp","hwpx"].includes(e))return"hwp"; if(["doc","docx","ppt","pptx","xls","xlsx"].includes(e))return"office"; return"pdf"; }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1600); }

function renderNav(){
  let html="", last="";
  ENDPOINTS.forEach((c,i)=>{
    if(c.group!==last){ html+=`<div class="nav-group">${c.group}</div>`; last=c.group; }
    html+=`<div class="nav-item${i===selected?' active':''}" data-i="${i}"><span class="m m-${c.method}">${c.method}</span><span>${c.name}</span></div>`;
  });
  nav.innerHTML=html;
  $$(".nav-item",nav).forEach(el=>el.onclick=()=>{ selected=+el.dataset.i; renderNav(); renderDetail(); });
}

function renderDetail(){
  const c = ENDPOINTS[selected];
  const pps = c.pathParams || pathParams(c.path).map(k=>({k,d:""}));
  let h = `<div class="d-head"><span class="m m-${c.method}">${c.method}</span><h2>${c.name}</h2></div>
    <div class="d-path">${esc(c.path)}</div>
    <div class="badges"><span class="tag">필요 스코프 <b>${c.scope}</b></span><span class="tag">성공 <b>${c.success}</b></span></div>
    <p class="desc">${c.desc}</p>`;
  if(pps.length){
    h+=`<div class="sec"><h3>경로 파라미터</h3><table><thead><tr><th>파라미터</th><th>값</th><th>설명</th></tr></thead><tbody>`;
    pps.forEach(p=>{ h+=`<tr><td class="k">${p.k}</td><td><input class="pi" data-pp="${p.k}" placeholder="${p.k}"></td><td class="opt">${p.d||""}</td></tr>`; });
    h+=`</tbody></table></div>`;
  }
  if(c.query){
    h+=`<div class="sec"><h3>쿼리 파라미터</h3><table><thead><tr><th>파라미터</th><th>값</th><th>설명</th></tr></thead><tbody>`;
    c.query.forEach(q=>{ h+=`<tr><td class="k">${q.k}</td><td><input class="pi" data-q="${q.k}" value="${q.v}" placeholder="${q.k}"></td><td class="opt">${q.d||""}</td></tr>`; });
    h+=`</tbody></table></div>`;
  }
  h+=`<div class="sec"><h3>요청 헤더</h3><div class="hdrs"><b>Authorization</b>: 서버(프록시)에서 자동 주입${c.body?`<br><b>Content-Type</b>: application/json`:""}</div></div>`;
  if(c.bodyFields){
    h+=`<div class="sec"><h3>요청 본문 필드</h3><table><thead><tr><th>필드</th><th>타입</th><th>필수</th><th>설명</th></tr></thead><tbody>`;
    c.bodyFields.forEach(f=>{ h+=`<tr><td class="k">${f.k}</td><td class="type">${f.t}</td><td>${f.req?'<span class="req">필수</span>':'<span class="opt">선택</span>'}</td><td class="opt">${f.d}</td></tr>`; });
    h+=`</tbody></table></div>`;
  }
  if(c.body){
    h+=`<div class="sec"><h3>요청 본문 (JSON · 편집 가능)</h3><textarea data-body>${esc(JSON.stringify(c.body,null,2))}</textarea>
      ${c.fileTarget?`<div class="file"><input type="file" data-file><span>선택하면 base64로 인코딩해 documents[0].data에 넣습니다</span></div>`:""}</div>`;
  }
  h+=`<div class="actions"><button class="call" data-act="call">호출 ▶</button><button class="ghost" data-act="curl">cURL 복사</button></div>
    <div class="resp"><div class="status"></div><pre></pre><p class="rh"></p></div>`;
  detail.innerHTML=h;
  const fi=$("[data-file]",detail); if(fi) fi.onchange=()=>injectFile(fi);
  $("[data-act='call']",detail).onclick=call;
  $("[data-act='curl']",detail).onclick=copyCurl;
  showSample(c);
}

// OCR 대상 경로+쿼리 (프록시 target으로 전달)
function buildTarget(){
  const c=ENDPOINTS[selected]; let p=c.path;
  (c.pathParams||pathParams(c.path).map(k=>({k}))).forEach(pp=>{
    const el=$(`[data-pp="${pp.k}"]`,detail); p=p.replace(`{${pp.k}}`, encodeURIComponent((el?.value||"").trim())); });
  let q="";
  if(c.query){ const parts=[]; c.query.forEach(qq=>{ const v=($(`[data-q="${qq.k}"]`,detail).value||"").trim(); if(v!=="") parts.push(encodeURIComponent(qq.k)+"="+encodeURIComponent(v)); }); if(parts.length) q="?"+parts.join("&"); }
  return p+q;
}
function proxyUrl(){ return "/api/proxy?target=" + encodeURIComponent(buildTarget()); }

function showSample(c){
  const resp=$(".resp",detail), st=$(".status",detail), pre=$("pre",detail);
  if(!c.sample){ resp.style.display="none"; return; }
  resp.style.display="block";
  const s=c.sample.status, cls=s>=500?"s-err":s>=400?"s-warn":(s>=200&&s<300)?"s-ok":"s-neutral";
  st.innerHTML=`<span class="pill ${cls}">${s}</span><span class="meta">샘플 응답 · 실제 호출 아님 (디자인 미리보기)</span>`;
  pre.textContent=JSON.stringify(c.sample.body,null,2);
}

async function call(){
  const c=ENDPOINTS[selected], btn=$("[data-act='call']",detail);
  const st=$(".status",detail), pre=$("pre",detail), rh=$(".rh",detail);
  const opts={ method:c.method, headers:{} };
  if(c.body){ const ta=$("[data-body]",detail); try{ JSON.parse(ta.value); }catch(e){ toast("요청 본문 JSON 오류"); return; }
    opts.headers["Content-Type"]="application/json"; opts.body=ta.value; }
  btn.disabled=true; btn.textContent="호출 중…";
  st.innerHTML=`<span class="meta">${c.method} ${esc(buildTarget())} (via /api/proxy)</span>`; pre.textContent=""; rh.textContent="";
  const t0=performance.now();
  try{
    const res=await fetch(proxyUrl(),opts); const ms=Math.round(performance.now()-t0);
    const cls=res.status>=500?"s-err":res.status>=400?"s-warn":(res.status>=200&&res.status<300)?"s-ok":"s-neutral";
    st.innerHTML=`<span class="pill ${cls}">${res.status}</span><span class="meta">${res.statusText||""} · ${ms}ms</span>`;
    const text=await res.text();
    try{ pre.textContent=JSON.stringify(JSON.parse(text),null,2); }catch(e){ pre.textContent=text||"(빈 응답)"; }
    const loc=res.headers.get("X-Upstream-Location"), wa=res.headers.get("X-Upstream-WWW-Authenticate");
    rh.textContent=[loc?`Location: ${loc}`:"", wa?`WWW-Authenticate: ${wa}`:""].filter(Boolean).join("   ");
  }catch(err){
    st.innerHTML=`<span class="pill s-err">ERR</span><span class="meta">요청 실패</span>`;
    pre.textContent=err.message+"\n\n· 배포됐나요? · OCR_BASE_URL/OCR_API_TOKEN 환경변수를 설정했나요?";
  }finally{ btn.disabled=false; btn.textContent="호출 ▶"; }
}

function injectFile(input){
  const f=input.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ const b64=(r.result.split(",")[1]||""); const ta=$("[data-body]",detail);
    let obj; try{ obj=JSON.parse(ta.value); }catch(e){ toast("본문 JSON을 먼저 고쳐주세요"); return; }
    obj.documents=obj.documents||[]; obj.documents[0]={ filename:f.name, format:fmtGuess(f.name), data:b64 };
    ta.value=JSON.stringify(obj,null,2); toast(`${f.name} → base64 삽입 (${b64.length.toLocaleString()}자)`); };
  r.readAsDataURL(f);
}

function copyCurl(){
  const c=ENDPOINTS[selected]; let s=`curl -X ${c.method} "${location.origin}${proxyUrl()}"`;
  if(c.body){ s+=` \\\n  -H "Content-Type: application/json"`; s+=` \\\n  -d '${$("[data-body]",detail).value.replace(/\n\s*/g," ")}'`; }
  navigator.clipboard.writeText(s).then(()=>toast("cURL 복사됨 (토큰은 서버가 주입)")).catch(()=>toast("복사 실패"));
}

renderNav(); renderDetail();
</script>
