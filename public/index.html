<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic OCR API 테스터</title>
<style>
  :root{
    --ground:#f4f6f8; --surface:#ffffff; --ink:#1b2431; --muted:#647082;
    --line:#dbe1ea; --sub:#eef2f7; --accent:#2563eb;
    --get:#0f766e; --post:#7c3aed;
    --ok:#0f766e; --warn:#b45309; --err:#be123c; --neutral:#64748b;
    --mono:"JetBrains Mono","Consolas","D2Coding",ui-monospace,monospace;
    --sans:"Pretendard","맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ground:#0d1218; --surface:#151c25; --ink:#e6ebf2; --muted:#93a2b4;
      --line:#293441; --sub:#1a222d; --accent:#6ba1ff;
      --get:#4cc7b8; --post:#b18cff;
      --ok:#4cc7b8; --warn:#e0a154; --err:#f4708c; --neutral:#8b98a8;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.5;}
  .app{display:flex;min-height:100vh;}

  /* ---- Sidebar ---- */
  .sidebar{width:264px;flex:none;background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;}
  .brand{padding:18px 18px 12px;border-bottom:1px solid var(--line);}
  .brand h1{font-size:15px;margin:0;letter-spacing:-.01em;}
  .brand p{font-size:11.5px;color:var(--muted);margin:3px 0 0;}
  .nav-group{padding:14px 12px 2px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;}
  .nav-item{display:flex;align-items:center;gap:9px;padding:9px 12px;margin:1px 8px;border-radius:8px;cursor:pointer;font-size:13px;}
  .nav-item:hover{background:var(--sub);}
  .nav-item.active{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-weight:600;}
  .nav-item.active .m{opacity:1;}
  .m{font-family:var(--mono);font-size:9.5px;font-weight:700;padding:2px 5px;border-radius:5px;color:#fff;flex:none;letter-spacing:.03em;}
  .m-GET{background:var(--get);} .m-POST{background:var(--post);}

  /* ---- Main ---- */
  main{flex:1;min-width:0;}
  .conn{display:flex;gap:12px;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 24px;position:sticky;top:0;z-index:5;flex-wrap:wrap;}
  .conn .fld{flex:1;min-width:220px;}
  .conn label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px;}
  .conn input{width:100%;font-family:var(--mono);font-size:12.5px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--ground);color:var(--ink);}
  .detail{max-width:820px;padding:26px 24px 90px;}

  .d-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .d-head .m{font-size:11px;padding:3px 8px;}
  .d-head h2{font-size:20px;margin:0;letter-spacing:-.01em;}
  .d-path{font-family:var(--mono);font-size:14px;color:var(--ink);background:var(--sub);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:12px 0;word-break:break-all;}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .tag{font-size:11px;font-family:var(--mono);padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--muted);}
  .tag b{color:var(--ink);}
  .desc{font-size:14px;color:var(--muted);margin:0 0 4px;max-width:64ch;}

  .sec{margin-top:24px;}
  .sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:700;}
  table{border-collapse:collapse;width:100%;font-size:13px;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--sub);font-weight:600;}
  tr:last-child td{border-bottom:none;}
  td.k{font-family:var(--mono);font-size:12px;white-space:nowrap;}
  td .pi{width:100%;font-family:var(--mono);font-size:12.5px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--ground);color:var(--ink);}
  .req{color:var(--err);font-weight:700;}
  .opt{color:var(--muted);}
  .type{font-family:var(--mono);font-size:11.5px;color:var(--accent);}

  textarea{width:100%;font-family:var(--mono);font-size:12.5px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--ground);color:var(--ink);min-height:150px;resize:vertical;line-height:1.5;}
  .hdrs{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--sub);border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
  .hdrs b{color:var(--ink);}
  .file{font-size:12px;color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

  .actions{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;}
  button{font-family:var(--sans);font-size:13.5px;font-weight:600;padding:10px 18px;border-radius:8px;border:1px solid transparent;cursor:pointer;}
  .call{background:var(--accent);color:#fff;}
  .call:hover{filter:brightness(1.06);}
  .call:disabled{opacity:.5;cursor:default;}
  .ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .ghost:hover{background:var(--sub);}

  .resp{margin-top:26px;border-top:1px dashed var(--line);padding-top:20px;}
  .status{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:13px;margin-bottom:10px;flex-wrap:wrap;}
  .pill{padding:3px 10px;border-radius:20px;font-weight:700;font-size:12px;color:#fff;}
  .s-ok{background:var(--ok);} .s-warn{background:var(--warn);} .s-err{background:var(--err);} .s-neutral{background:var(--neutral);}
  .meta{color:var(--muted);}
  pre{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow:auto;font-family:var(--mono);font-size:12.5px;margin:0;max-height:460px;}
  .rh{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin:8px 0 0;word-break:break-all;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;}
  .toast.show{opacity:1;}

  @media(max-width:780px){
    .app{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:2px;padding-bottom:8px;}
    .brand{width:100%;}
    .nav-group{width:100%;}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>Agentic OCR API</h1>
      <p>외부 연동 10종 · 목서버 테스트</p>
    </div>
    <nav id="nav"></nav>
  </aside>

  <main>
    <div class="detail" id="detail"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
// 상태 조회 응답 = 취소 응답과 동일한 형식(명세 §5.2 · §5.4). 공용으로 사용.
const TX_STATUS_RESP = [
  {k:"transaction_id", t:"string", d:"트랜잭션 식별자"},

  {k:"client_request_no", t:"string", d:"v2.0.2 신설. 제출 시 지정하신 고객사 요청번호(미지정이면 null). ※ 유일하지 않습니다 — 같은 값을 가진 트랜잭션이 여러 건 있을 수 있습니다(§5.1)"},

  {k:"validation_status", t:"enum", d:"문서 검증 결과 종합(pass·needs_review·rejected). 전건 실패·취소면 null"},
  {k:"file_count", t:"integer", d:"고객이 제출한 파일 수. ※ 결과 응답의 documents 길이와 다를 수 있습니다 — 분할(split)이 일어나면 파일 1건이 문서 여러 건이 됩니다"},
  {k:"counts", t:"object", d:"문서별 집계(아래)"},
  {k:"counts.succeeded", t:"integer", d:"처리 성공 수"},
  {k:"counts.failed", t:"integer", d:"처리 실패 수"},
  {k:"counts.canceled", t:"integer", d:"취소 수"},
  {k:"counts.pass", t:"integer", d:"검증 통과 수"},
  {k:"counts.needs_review", t:"integer", d:"검토 필요 수"},
  {k:"counts.rejected", t:"integer", d:"검증 반려 수"},
  {k:"counts.corrected", t:"integer", d:"사람이 교정해 해소한 수"},
  {k:"counts.rejected_final", t:"integer", d:"반려 확정 수"},
  {k:"plugin_status", t:"enum", d:"후속 콜백 전송 상태(not_applicable·pending·done·failed) — 콜백 규격은 §12"},
  {k:"callback_ready", t:"boolean", d:"콜백 전송 가능 상태 여부"},
  {k:"submitted_by", t:"string", d:"제출 주체 식별자"},
  {k:"submitted_by_display_name", t:"string", d:"제출 주체 표시명"},
  {k:"submitted_at", t:"datetime", d:"제출 시각"},
  {k:"started_at", t:"datetime", d:"처리 시작 시각"},
  {k:"finished_at", t:"datetime", d:"처리 종료 시각"},
  {k:"idempotency_key", t:"string", d:"외부 제출에서는 항상 null"},
  {k:"webhook_ref", t:"string", d:"콜백 대상 참조"},
  {k:"ingestion_route", t:"enum", d:"제출 인입 경로 — 본 API 제출은 api, 제품 화면 업로드는 manual"},
];

const ENDPOINTS = [
  { group:"트랜잭션", name:"트랜잭션 제출", method:"POST", path:"/v1/transactions",
    scope:"workflow:execute", success:"202",
    desc:"문서 1건 이상을 제출해 처리를 시작합니다. 1회 제출 = 1 트랜잭션이며, 파일은 base64로 본문에 담습니다.",
    respFields:[
      {k:"transaction_id", t:"string", d:"트랜잭션 식별자. 이후 상태·결과·취소 호출에 사용합니다"},
      {k:"status", t:"enum", d:"접수 직후 상태(running)"},
      {k:"client_transaction_no", t:"string", d:"제출하신 거래번호를 그대로 되돌려 싣습니다(미지정·공백이면 null). 접수 확인용입니다"},
      {k:"client_request_no", t:"string", d:"v2.0.2 신설. 제출하신 요청번호를 그대로 되돌려 싣습니다(미지정·공백이면 null). 두 번호를 함께 보내신 호출자가 응답 하나로 둘 다 대조할 수 있도록 양쪽을 에코합니다"},
    ],
    bodyFields:[
      {k:"workflow_id", t:"string", req:true, d:"처리에 사용할 워크플로우 식별자"},
      {k:"documents", t:"array", req:true, d:"제출 문서 목록"},
      {k:"documents[].filename", t:"string", req:true, d:"원본 파일명. 결과의 document_name으로 반환됩니다"},
      {k:"documents[].format", t:"enum", req:true, d:"문서 포맷. 각 값이 받는 확장자는 §3.6 참조 — image 7종·hwp 2종(hwp·hwpx)·office 6종(docx·doc·pptx·ppt·xlsx·xls)을 각각 하나의 값으로 묶습니다. ※ office·hwp 는 어느 형식인지를 filename 확장자로만 판별하므로 확장자가 없으면 422 로 거부됩니다(PDF 변환 대상 판정 불가). 서버는 본문 바이트를 여는 내용 기반 형식 검사를 하지 않으니, format 과 확장자를 정확하게 맞춰 보내십시오"},
      {k:"documents[].data", t:"base64", req:true, d:"문서 바이트의 base64 인코딩 값"},
      {k:"client_transaction_no", t:"string", req:false, d:"고객사 시스템이 부여한 거래번호. 선택 항목이며 서버가 채번하지 않고 받은 값을 그대로 저장합니다. 공백뿐인 값·빈 문자열은 거부가 아니라 미지정으로 정규화됩니다. 대소문자를 구분합니다(ABC1 ≠ abc1). 제출·상태·결과 응답과 콜백 payload 에 그대로 실려 돌아옵니다(§5.2·§5.3·§12.3 · 결과 다운로드 result.json 봉투) — 고객사 원장과의 대조에 사용하십시오. ※ 형식 위반은 422, 중복은 409 입니다(아래 §오류) v2.0.2 규격 확장 — 종전은 「영숫자만·최대 20자」였습니다. 점·언더스코어·하이픈·콜론·슬래시가 허용되고 길이가 64자로 늘었습니다. 넓어지는 방향이라 종전 규격을 통과하던 값은 전부 그대로 통과합니다. 공백·한글·공백류·역슬래시는 계속 거부됩니다"},
      {k:"client_request_no", t:"string", req:false, d:"v2.0.2 신설. 고객사 시스템이 부여한 요청번호. 한 번의 업무 요청이 트랜잭션 여러 건으로 갈릴 때 그 건들을 묶는 번호입니다. 형식·정규화·대소문자 규칙은 client_transaction_no 와 같고 제출 응답·상태 조회·결과 조회·콜백 payload 에 그대로 되돌아옵니다(§5.2·§5.3·§12.3 · 결과 다운로드 result.json 봉투). ※ 테넌트 내 유일성을 보장하지 않습니다 — 같은 값을 여러 트랜잭션에 쓸 수 있고 중복이 409 로 거부되지 않습니다(「한 요청에 트랜잭션 N건」을 표현하기 위한 항목이므로 그것이 정상 동작입니다). 중복 생성 방지에는 이 필드가 아니라 client_transaction_no 를 쓰십시오(§9-2)"},
      {k:"callback_url", t:"string", req:false, d:"처리 결과를 수신할 콜백 주소. 지정하면 이 트랜잭션의 콜백이 이 주소로 전송됩니다(§12). 생략하면 인스턴스 설정값(§12.2)으로 전송되며 그것도 없으면 콜백을 보내지 않습니다. 스킴·호스트가 규격을 벗어나면 제출 자체가 422 로 실패합니다"},

    body:{ workflow_id:"019fb63d-1c2a-7f01-9c8e-5b1d0f9a2e44", client_transaction_no:"CLM-2026-000123", client_request_no:"REQ-2026-000123",

  { group:"트랜잭션", name:"트랜잭션 상태 조회", method:"GET", path:"/v1/transactions/{transaction_id}",
    scope:"workflow:result", success:"200",
    desc:"트랜잭션의 진행 상태와 문서별 집계를 조회합니다. 완료 판정에 쓰는 폴링 대상 API입니다.",

  { group:"트랜잭션", name:"트랜잭션 결과 조회", method:"GET", path:"/v1/transactions/{transaction_id}/result",
    scope:"workflow:result", success:"200",
    desc:"문서별 추출 필드 값과 검증 결과를 조회합니다. status가 completed/partially_completed일 때만 값이 채워집니다.",
    respFields:[
      {k:"transaction_id", t:"string", d:"트랜잭션 식별자"},
      {k:"workflow_id", t:"string", d:"이 트랜잭션을 처리한 워크플로우"},
      {k:"active_release_id", t:"string", d:"실제 실행된 워크플로우 배포본. 같은 워크플로우라도 배포본이 다르면 결과 형태가 달라질 수 있어 재현·문의 시 이 값이 기준입니다"},
      {k:"client_transaction_no", t:"string", d:"제출 시 지정한 고객 측 관리번호를 그대로 되돌려줍니다(§5.1). 미지정이면 null. 고객 원장 · 처리 결과 대조의 열쇠입니다"},
      {k:"client_request_no", t:"string", d:"v2.0.2 신설. 제출 시 지정한 고객 측 요청번호(미지정이면 null). 한 요청이 트랜잭션 여러 건으로 갈렸을 때 그 건들을 원장의 한 요청으로 묶는 단서입니다. ※ 유일하지 않으므로 단독 대조 키로 쓰지 마십시오(§5.1)"},
      {k:"status", t:"enum", d:"트랜잭션 상태(§6.1)"},
      {k:"result_url", t:"string", d:"결과 검토 화면 딥링크. 인스턴스 설정 app_base_host가 비어 있으면 null. ※ 제품 UI 로그인이 필요한 링크라 API 전용 연동에서는 열리지 않을 수 있습니다"},
      {k:"documents", t:"array", d:"문서별 결과"},
      {k:"documents[].document_id", t:"string", d:"문서 식별자"},
      {k:"documents[].status", t:"enum", d:"문서 상태(§6.2)"},
      {k:"documents[].document_name", t:"string", d:"제출 시 filename. ※ 문서 분할(split)이 일어나면 조각이 원본 파일명을 그대로 승계하므로 여러 행이 같은 값을 가집니다 — 행 구분에 쓰지 마십시오"},
      {k:"documents[].source_file_id", t:"string", d:"분할되기 전 원본 파일의 식별자. 같은 값을 가진 문서끼리 묶으면 한 파일에서 나온 조각입니다. 분할이 없으면 document_id와 같습니다. 문서 행의 유일 키 = (source_file_id, ordinal)"},
      {k:"documents[].doc_type", t:"string", d:"최종 문서 종류(예: 사업자등록증). 사람이 분류를 고쳤다면 고친 값입니다"},
      {k:"documents[].doc_type_code", t:"string", d:"문서 종류의 영문코드. 대상 시스템 적재 키이며 워크플로우 저작 시 분류 클래스마다 지정합니다. ※ 재분류로 doc_type이 바뀌면 코드도 따라 바뀝니다. 저작하지 않았거나 제품 설정에서 이 기능이 꺼져 있으면 null — 값을 추측해 채우지 마십시오(「기타」의 ETC는 저작 시점 기본값이며 읽기 시점 폴백이 아닙니다)"},
      {k:"documents[].predicted_doc_type", t:"string", d:"사람이 고치기 전 모델이 예측한 문서 종류. pass(교정 없음 · doc_type과 같은 값) · corrected(교정 전 원본) 문서에 채워집니다"},
      {k:"documents[].ordinal", t:"integer", d:"그 파일 안에서의 문서 순번(1부터, 분할이 없으면 1). ※ 응답 전체에서 유일하지 않습니다 — 유일 키는 (source_file_id, ordinal)입니다. ※ 단, 이 순번은 한 응답 안에서 행을 가르기 위한 값이며 장기 보관용 키가 아닙니다. 고객사 담당자가 제품 화면에서 분할 경계를 교정하면 순번이 1..N 으로 다시 부여되고, 두 건을 합친 경우 그 행 자체가 사라집니다. 즉 교정 이전에 받으신 (source_file_id, ordinal) 이 재조회 시 다른 문서를 가리킬 수 있습니다. 결과를 원장에 장기 보관하실 때는 document_id 를 함께 저장하십시오 — 교정된 문서는 document_id 가 사라지거나 새로 생기므로, 순번처럼 안내 없이 다른 문서로 바뀌지는 않습니다"},
      {k:"documents[].page_range", t:"object", d:"{ 'start': 1, 'end': 2 } — 1부터 시작하는 포함 구간"},
      {k:"documents[].extracted_fields", t:"array", d:"추출된 필드 값 목록. 값이 없으면 [](null이 아닙니다)"},
      {k:"documents[].extracted_fields[].key", t:"string", d:"항목 이름(저작 화면에서 정한 이름)"},
      {k:"documents[].extracted_fields[].field_code", t:"string", d:"항목의 영문코드. 고객 시스템의 적재 컬럼명으로 쓰라고 제공합니다. 형식 = 영문자로 시작, 이후 영숫자·언더스코어, 최대 64자. 저작하지 않았거나 제품 설정에서 이 기능이 꺼져 있으면 null — 값을 추측해 채우지 마십시오. ※ 문서 종류 코드(doc_type_code)와는 레벨이 다른 별도 축이라 값이 같아도 무엇을 가리키는지 특정됩니다"},
      {k:"documents[].extracted_fields[].dtype", t:"string", d:"v2.0.2 신설. 항목 형식 선언 — 워크플로우 저작 시 그 항목에 고른 값의 형식입니다. 어휘 6종 = string · date · int · float · array · bool ※ array 값의 표기 규약 — 원소를 , (콤마·공백)으로 이으며 원소 안에 콤마가 있으면 그 원소를 인용부호로 감쌉니다. 단순 콤마 분리로 나누면 원소가 손상되므로 CSV 파서에서는 선두 공백을 건너뛰는 옵션(Python csv 의 skipinitialspace=True)을 켜 주십시오 ※ 저작 시점의 ·선언·이며 value 의 실제 형식을 보증하지 않습니다 — value 는 종전과 같이 문자열로 나갑니다. 선언대로 캐스팅을 시도하시되 실패했을 때의 처분을 준비하십시오 ※ 값이 없으면 null 이며 기본값으로 채워지지 않습니다. 형식을 지정하지 않은 항목이 그렇습니다. 'string' 은 6종 어휘의 실제 값이므로 null 을 'string' 으로 대신 읽지 마십시오 — 「모른다」와 「문자열이다」가 구분되지 않습니다 ※ 소급되지 않습니다 — 이 빌드 이전에 처리된 문서의 결과에는 null 이며 백필하지 않으므로 과거 트랜잭션을 재조회하셔도 채워지지 않습니다 ※ 표·그룹 컨테이너 자체에는 실리지 않습니다(형식은 leaf 항목의 속성입니다). 영문코드(field_code) 설정 상태와는 무관하게 실립니다 — 별개의 축입니다"},
      {k:"documents[].extracted_fields[].value", t:"string", d:"항상 원본 추출값입니다. 비식별 처리(redact) 경유 여부와 무관하게 마스킹되지 않으며, 마스킹본은 masked_value에 따로 실립니다(§5.3-3)"},
      {k:"documents[].extracted_fields[].masked_value", t:"string", d:"마스킹 적용값. 마스킹이 실제로 산출됐을 때만 채워집니다. ※ null은 「마스킹 불필요」가 아니라 「마스킹 산출이 없었다」는 뜻이며, 판정 근거는 문서의 redact_applied입니다"},
      {k:"documents[].extracted_fields[].predicted_value", t:"string", d:"사람이 교정하기 전 모델 예측값(원본). pass(교정 없음 · value와 같은 값) · corrected(교정 전 원본) 문서에 채워집니다 · 채점은 이 축 하나만 읽으면 됩니다(「null이면 value로 폴백」 규칙이 필요 없습니다). ※ 이 값으로 「교정 여부」를 판정하지 마십시오 — 문서 status를 보십시오"},
      {k:"documents[].extracted_fields[].predicted_masked_value", t:"string", d:"그 예측값의 마스킹본. 위와 같되 마스킹이 산출된 문서에만 채워집니다"},
      {k:"documents[].extracted_fields[].confidence", t:"number", d:"필드 신뢰도(0~1). 모델 토큰 확률에서 산출됩니다. · 추출값이 비어 있는 필드는 0.0 입니다 — 값을 찾지 못했다는 판정 자체가 신뢰도 0 입니다(무값에 대한 과신 방지). 오류가 아닙니다 · 사람이 교정한 필드는 1.0 입니다 — 모델 산출값이 아니므로 모델 성능 집계에서는 제외하십시오 · 신뢰도를 산출할 수 없는 경우에만 null 입니다 — 추출 출력이 확률값을 동반하지 않는 형태일 때, 값이 숫자로 해석되지 않을 때, 그리고 실패·취소 문서일 때입니다. API 가 null 을 임의로 0 으로 대체하지는 않습니다 ※ 0.0 과 null 은 다릅니다. 0.0 = 「찾았는데 비었다」, null = 「판정 자체를 못 했다」 — 둘 다 「추출 실패」로 읽지 마십시오"},
      {k:"documents[].extracted_tables", t:"array", d:"정의된 표(table) 추출 결과. { 'key', 'field_code', 'headers': [...], 'rows': [[cell, …], …] } — cell 은 extracted_fields[] 항목과 완전히 동형입니다(key·field_code·confidence · 값 4슬롯). 값이 없으면 []"},
      {k:"documents[].extracted_groups", t:"array", d:"정의된 그룹키(group) 추출 결과. { 'key', 'field_code', 'fields': [cell, …] } — 중첩은 1단. 값이 없으면 []"},
      {k:"documents[].confidence_summary", t:"object", d:"{ 'mean': …, 'min': … } — 신뢰도가 있는 필드들의 평균·최솟값(0.0·1.0 도 집계에 포함됩니다). 전 필드가 null이면 각 값도 null. 문서 단위 선별(예: min이 낮은 건만 검수)에 씁니다"},
      {k:"documents[].redact_applied", t:"boolean", d:"비식별 처리 단계 경유 여부. masked_value가 null인 이유를 판정하는 근거입니다 — false면 「마스킹을 아예 안 돌렸다」, true인데 masked_value가 null이면 「돌렸으나 이 항목은 대상이 아니었다」입니다. 미완료·실패·취소 문서는 null"},
      {k:"documents[].failure", t:"object", d:"v2.0.2 신설. 실패한 문서의 사유. status = 'failed' 문서에만 값이 있고 그 밖의 문서에는 null 입니다 — 성공 문서에도 null 로 자리가 있으므로 키는 항상 존재합니다. 취소된 문서(canceled)에는 사유가 없습니다 ※ null 이 「실패하지 않았다」를 뜻하지 않습니다 — 사유 기록이 없거나 온전하지 않은 실패 문서도 null 입니다: ① 닫힌 12종 어휘로 분류되지 않는 실패 ② code·retryable·message 중 하나라도 누락되거나 형식 불일치 ③ message 가 빈 문자열 ④ 부기된 단계 상태가 실제 처리 상태와 어긋나는 경우 ⑤ 처리 프로세스 전체가 중단된 경우(메모리 부족·컨테이너 재시작). 실패 여부는 종전대로 문서 status 로만 판정하십시오 ※ 내부 추적 식별자(trace_id)는 싣지 않습니다. 장애 문의 시에는 transaction_id 와 실패 시각을 알려주시면 됩니다"},
      {k:"documents[].failure.stage", t:"enum", d:"실패한 단계 — parse | classify | extract | validate | redact"},
      {k:"documents[].failure.code", t:"enum", d:"사유 코드 — 닫힌 12종. input_invalid(입력 문서가 처리 규격에 맞지 않음) | unsupported_capability(요구된 처리 능력이 지원 범위 밖) | deployment_not_ready(배포 구성이 처리 가능한 상태가 아님) | limit_exceeded(상한 초과) | model_contract_error(모델 호출 규격 불일치) | model_transient(모델 일시 장애 — 타임아웃·연결 실패) | model_output_invalid(모델 산출이 해석 불가) | processing_error(단계 처리 중 오류) | optional_feature_error(선택 기능 처리 실패) | storage_failed(저장소 접근 실패) | cancelled(처리 중단) | internal_error(위로 분류되지 않는 내부 오류). ※ 어휘가 늘어나면 별도 고지합니다 — 모르는 값을 만나면 버리지 말고 그대로 기록하십시오"},
      {k:"documents[].failure.retryable", t:"boolean", d:"같은 입력을 다시 제출하면 해소될 수 있는 부류인가. model_transient 가 true 인 대표 부류입니다 ※ true 라도 제품이 자동으로 재처리하지 않습니다 — 재제출 여부는 호출자 판단입니다. 자동 재제출을 구현하시는 경우 같은 문서가 반복 실패할 때의 상한을 함께 두십시오"},
      {k:"documents[].failure.message", t:"string", d:"사유 문면. 정제된 문자열이며 traceback, Authorization 헤더값, api_key／password／secret／token 류 대입값, 절대경로(Unix·Windows·UNC), 제어문자를 제거하고 240자로 절단합니다. ※ 파일명 단독 문자열을 지우는 규칙은 없습니다 — 경로에 포함된 파일명은 <local-path> 로 치환되지만 경로 없이 문서명만 있는 문면은 그대로 남을 수 있습니다. 사람이 읽는 용도이므로 이 문자열로 분기하지 마십시오 — 분기는 code 로 하십시오(문면은 고정 계약이 아닙니다)"},
      {k:"documents[].validation_attribute", t:"object", d:"검증 결과(아래)"},
      {k:"documents[].validation_attribute.status", t:"enum", d:"pass | needs_review | rejected"},
      {k:"documents[].validation_attribute.reason", t:"string", d:"사유 문자열(예: normal_rule_fail). ※ 값 목록은 고정 계약이 아니며 후속 패치에서 어휘가 세분화될 수 있습니다 — 이 값으로 분기하지 말고 로그·표시 용도로만 쓰십시오. 신뢰도 임계치 등 내부 지표 수치는 API 응답·콜백 payload 에 포함되지 않습니다"},
      {k:"documents[].validation_attribute.reason_detail", t:"string", d:"사람이 읽는 사유 문구(예: 「필수 항목이 비어 있습니다: ··」). 산출되지 않았으면 null"},
      {k:"documents[].validation_attribute.flagged_fields", t:"array", d:"{ 'field_key': …, 'signals': [...] } — 문제로 표시된 필드"},
      {k:"documents[].validation_attribute.rule_set_version", t:"string", d:"적용된 규칙 세트 버전"},
      {k:"documents[].validation_attribute.evaluated_at", t:"datetime", d:"검증 수행 시각"},
      {k:"meta.processed_at", t:"datetime", d:"처리 완료 시각(UTC). 미완료 트랜잭션은 null"},
      {k:"meta.file_count", t:"integer", d:"고객이 제출한 파일 수. ※ documents 길이와 다를 수 있습니다 — 분할(split)이 일어나면 파일 1건이 문서 여러 건이 됩니다. 파일 수를 세려면 이 축을 쓰십시오"},
    ],

  { group:"워크플로우", name:"워크플로우 목록", method:"GET", path:"/v1/workflows",
    scope:"workflow:read", success:"200",
    desc:"제출 대상으로 지정할 수 있는 워크플로우 목록을 조회합니다. active만 반환됩니다.",
    respFields:[
      {k:"items", t:"array", d:"워크플로우 목록"},
      {k:"items[].workflow_id", t:"string", d:"워크플로우 식별자 — 제출 시 사용"},
      {k:"items[].name", t:"string", d:"이름"},
      {k:"items[].description", t:"string", d:"설명"},
      {k:"items[].doc_type", t:"string", d:"대상 문서 종류"},
      {k:"items[].status", t:"enum", d:"draft(초안) | active(활성)"},
      {k:"items[].active_release_id", t:"string", d:"활성 릴리스 식별자"},
      {k:"items[].activated_at", t:"datetime", d:"활성화 시각"},
      {k:"page", t:"integer", d:"현재 페이지"},
      {k:"page_size", t:"integer", d:"페이지 크기"},
      {k:"total", t:"integer", d:"전체 건수"},
    ],
    query:[ {k:"status", v:"active", t:"enum", d:"조회 대상 상태. ※ active 외의 값(all·draft 등)은 400 으로 거부됩니다(§9-1) — 요청하신 것과 다른 결과를 말없이 돌려드리지 않습니다. 정렬은 검토 대기 우선 순이며 호출자가 바꿀 수 없습니다"}, {k:"page", v:"1", t:"integer", d:"페이지 번호"}, {k:"page_size", v:"20", t:"integer", d:"페이지 크기"} ],
    sample:{ status:200, body:{ items:[ { workflow_id:"019fb63d-1c2a-7f01-9c8e-5b1d0f9a2e44", name:"진단서 추출",

const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const detail=$("#detail"), nav=$("#nav");

// Base URL·API 키는 서버 .env(/api/config)에서만 가져온다 (화면 입력 없음)
let CFG={ base:"", key:"" };
async function ensureConfig(){
  if(CFG.base) return CFG;
  try{ const c=await (await fetch("/api/config")).json(); CFG.base=c.base||""; CFG.key=c.key||""; }catch(e){}
  return CFG;
}
ensureConfig();

let selected = 0;
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function pathParams(p){ return [...p.matchAll(/\{(\w+)\}/g)].map(m=>m[1]); }
function fmtGuess(name){ const e=(name.split(".").pop()||"").toLowerCase();
  if(e==="pdf")return"pdf"; if(["jpg","jpeg","png","tif","tiff","gif","webp"].includes(e))return"image";
  if(["hwp","hwpx"].includes(e))return"hwp"; if(["doc","docx","ppt","pptx","xls","xlsx"].includes(e))return"office"; return"pdf"; }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1600); }

function renderNav(){
  let html="", last="";
  ENDPOINTS.forEach((c,i)=>{
    if(c.group!==last){ html+=`<div class="nav-group">${c.group}</div>`; last=c.group; }
    html+=`<div class="nav-item${i===selected?' active':''}" data-i="${i}">
      <span class="m m-${c.method}">${c.method}</span><span>${c.name}</span></div>`;
  });
  nav.innerHTML=html;
  $$(".nav-item",nav).forEach(el=>el.onclick=()=>{ selected=+el.dataset.i; renderNav(); renderDetail(); });
}

function renderDetail(){
  const c = ENDPOINTS[selected];
  const pps = c.pathParams || pathParams(c.path).map(k=>({k,d:""}));
  let h = `<div class="d-head"><span class="m m-${c.method}">${c.method}</span><h2>${c.name}</h2></div>
    <div class="d-path">${esc(c.path)}</div>
    <div class="badges"><span class="tag">필요 스코프 <b>${c.scope}</b></span><span class="tag">성공 <b>${c.success}</b></span></div>
    <p class="desc">${c.desc}</p>`;

  if(pps.length){
    h+=`<div class="sec"><h3>요청 필드</h3><table><thead><tr><th>필드</th><th>값</th><th>타입</th><th>필수</th><th>설명</th></tr></thead><tbody>`;
    pps.forEach(p=>{ h+=`<tr><td class="k">${p.k}</td><td><input class="pi" data-pp="${p.k}" placeholder="${p.k}"></td><td class="type">string</td><td><span class="req">필수</span></td><td class="opt">${esc(p.d||"")}</td></tr>`; });
    h+=`</tbody></table></div>`;
  }
  if(c.query){
    h+=`<div class="sec"><h3>요청 필드</h3><table><thead><tr><th>필드</th><th>값</th><th>타입</th><th>필수</th><th>설명</th></tr></thead><tbody>`;
    c.query.forEach(q=>{ h+=`<tr><td class="k">${q.k}</td><td><input class="pi" data-q="${q.k}" value="${esc(q.v)}" placeholder="${q.k}"></td><td class="type">${q.t||"string"}</td><td><span class="opt">선택</span></td><td class="opt">${esc(q.d||"")}</td></tr>`; });
    h+=`</tbody></table></div>`;
  }

  if(c.bodyFields){
    h+=`<div class="sec"><h3>요청 필드</h3><table><thead><tr><th>필드</th><th>값</th><th>타입</th><th>필수</th><th>설명</th></tr></thead><tbody>`;
    c.bodyFields.forEach(f=>{
      let cell;
      if(f.k==="documents") cell=`<span class="opt">배열 · 아래 documents[].* 값으로 구성</span>`;
      else if(f.k==="documents[].data") cell=`<input type="hidden" data-bf="documents[].data"><span class="opt" data-datastat>파일을 선택하면 base64가 자동 입력됩니다</span>`;
      else cell=`<input class="pi" data-bf="${f.k}" value="${esc(bfDefault(c,f.k))}" placeholder="${f.k}">`;
      h+=`<tr><td class="k">${f.k}</td><td>${cell}</td><td class="type">${f.t}</td><td>${f.req?'<span class="req">필수</span>':'<span class="opt">선택</span>'}</td><td class="opt">${esc(f.d)}</td></tr>`;
    });
    h+=`</tbody></table>
      ${c.fileTarget?`<div class="file"><input type="file" data-file><span>선택하면 base64로 인코딩해 documents[].data / filename / format 값을 채웁니다</span></div>`:""}</div>`;
  }

  h+=`<div class="sec"><h3>요청 헤더</h3><div class="hdrs"><b>Authorization</b>: Bearer &lt;키&gt;${c.body?`<br><b>Content-Type</b>: application/json`:""}</div></div>`;

  if(c.respFields){
    h+=`<div class="sec"><h3>응답 필드 (${c.success})</h3><table><thead><tr><th>필드</th><th>타입</th><th>설명</th></tr></thead><tbody>`;
    c.respFields.forEach(f=>{ h+=`<tr><td class="k">${esc(f.k)}</td><td class="type">${esc(f.t)}</td><td class="opt">${esc(f.d)}</td></tr>`; });
    h+=`</tbody></table></div>`;
  }

  // 파일(base64) 업로드 화면은 본문이 너무 커 cmd 한 줄 제한(8191자)에 안 맞으므로 cURL 버튼 숨김
  h+=`<div class="actions"><button class="call" data-act="call">호출 ▶</button>${c.fileTarget?"":`<button class="ghost" data-act="curl">cURL 복사</button>`}</div>
    <div class="resp"><div class="status"></div><pre></pre><p class="rh"></p></div>`;

  detail.innerHTML=h;
  const fi=$("[data-file]",detail); if(fi) fi.onchange=()=>injectFile(fi);
  $("[data-act='call']",detail).onclick=call;
  const cb=$("[data-act='curl']",detail); if(cb) cb.onclick=copyCurl;
  showSample(c);
}

// OCR 상대 경로+쿼리 (프록시 target 및 cURL 공용)
function buildPath(){
  const c=ENDPOINTS[selected]; let p=c.path;
  (c.pathParams||pathParams(c.path).map(k=>({k}))).forEach(pp=>{
    const el=$(`[data-pp="${pp.k}"]`,detail); p=p.replace(`{${pp.k}}`, encodeURIComponent((el?.value||"").trim())); });
  let q="";
  if(c.query){ const parts=[]; c.query.forEach(qq=>{ const v=($(`[data-q="${qq.k}"]`,detail).value||"").trim(); if(v!=="") parts.push(encodeURIComponent(qq.k)+"="+encodeURIComponent(v)); }); if(parts.length) q="?"+parts.join("&"); }
  return p+q;
}
function buildUrl(){ return CFG.base.replace(/\/$/,"")+buildPath(); } // cURL용 직접 URL (base 포함)

// 본문 필드 기본값(샘플 body에서). documents[].x 는 documents[0].x 로 매핑
function bfDefault(c,k){
  const b=c.body||{};
  if(k==="documents") return "";
  if(k.startsWith("documents[].")){ const key=k.slice(12); return (b.documents&&b.documents[0]&&b.documents[0][key])||""; }
  return b[k]||"";
}
// 화면의 input 값으로 요청 본문 JSON 조립 (빈 값은 생략)
function buildBody(){
  const c=ENDPOINTS[selected]; if(!c.bodyFields) return {};
  const obj={}; let doc=null;
  c.bodyFields.forEach(f=>{
    if(f.k==="documents") return;
    const el=$(`[data-bf="${f.k}"]`,detail); if(!el) return;
    const v=el.value.trim(); if(v==="") return;
    if(f.k.startsWith("documents[].")){ doc=doc||{}; doc[f.k.slice(12)]=v; }
    else obj[f.k]=v;
  });
  if(doc) obj.documents=[doc];
  return obj;
}

function showSample(c){
  const resp=$(".resp",detail), st=$(".status",detail), pre=$("pre",detail);
  if(!c.sample){ resp.style.display="none"; return; }
  resp.style.display="block";
  const s=c.sample.status, cls=s>=500?"s-err":s>=400?"s-warn":(s>=200&&s<300)?"s-ok":"s-neutral";
  st.innerHTML=`<span class="pill ${cls}">${s}</span><span class="meta">샘플 응답 · 실제 호출 아님 (디자인 미리보기)</span>`;
  pre.textContent=JSON.stringify(c.sample.body,null,2);
}

async function call(){
  const c=ENDPOINTS[selected], btn=$("[data-act='call']",detail);
  const st=$(".status",detail), pre=$("pre",detail), rh=$(".rh",detail);
  const target=buildPath(), opts={ method:c.method, headers:{} };  // 프록시 경유 (토큰은 서버가 주입, CORS 없음)
  if(c.bodyFields){ opts.headers["Content-Type"]="application/json"; opts.body=JSON.stringify(buildBody()); }
  btn.disabled=true; btn.textContent="호출 중…";
  st.innerHTML=`<span class="meta">${c.method} ${esc(target)} (via /api/proxy)</span>`; pre.textContent=""; rh.textContent="";
  const t0=performance.now();
  try{
    const res=await fetch("/api/proxy?target="+encodeURIComponent(target),opts); const ms=Math.round(performance.now()-t0);
    const cls=res.status>=500?"s-err":res.status>=400?"s-warn":(res.status>=200&&res.status<300)?"s-ok":"s-neutral";
    st.innerHTML=`<span class="pill ${cls}">${res.status}</span><span class="meta">${res.statusText||""} · ${ms}ms</span>`;
    const text=await res.text();
    try{ pre.textContent=JSON.stringify(JSON.parse(text),null,2); }catch(e){ pre.textContent=text||"(빈 응답)"; }
    const loc=res.headers.get("X-Upstream-Location"), wa=res.headers.get("X-Upstream-WWW-Authenticate");
    rh.textContent=[loc?`Location: ${loc}`:"", wa?`WWW-Authenticate: ${wa}`:""].filter(Boolean).join("   ");
  }catch(err){
    st.innerHTML=`<span class="pill s-err">ERR</span><span class="meta">요청 실패</span>`;
    pre.textContent=err.message+"\n\n· 배포됐나요? · Vercel에 OCR_BASE_URL/OCR_API_TOKEN 환경변수가 설정돼 있나요?";
  }finally{ btn.disabled=false; btn.textContent="호출 ▶"; }
}

function injectFile(input){
  const f=input.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ const b64=(r.result.split(",")[1]||"");
    const set=(k,v)=>{ const el=$(`[data-bf="documents[].${k}"]`,detail); if(el) el.value=v; };
    set("filename",f.name); set("format",fmtGuess(f.name)); set("data",b64);
    const stat=$("[data-datastat]",detail); if(stat) stat.textContent=`${f.name} · base64 ${b64.length.toLocaleString()}자 입력됨`;
    toast(`${f.name} → base64 삽입 (${b64.length.toLocaleString()}자)`); };
  r.readAsDataURL(f);
}

// cmd(Windows)에 그대로 붙여넣어 실행 가능한 한 줄 cURL.
// - 줄바꿈/역슬래시 연결 없음(한 줄) → cmd·PowerShell·bash 모두 동작
// - 본문은 큰따옴표로 감싸고 내부 "는 \" 로 이스케이프(cmd의 작은따옴표 미지원 회피)
async function copyCurl(){
  await ensureConfig();
  const c=ENDPOINTS[selected];
  let s=`curl -X ${c.method} "${buildUrl()}"`;
  if(CFG.key) s+=` -H "Authorization: Bearer ${CFG.key}"`;
  if(c.bodyFields){
    s+=` -H "Content-Type: application/json"`;
    const json=JSON.stringify(buildBody());
    s+=` -d "${json.replace(/"/g,'\\"')}"`;
  }
  navigator.clipboard.writeText(s).then(()=>toast("cURL 복사됨 · cmd에 붙여넣어 실행")).catch(()=>toast("복사 실패"));
}

renderNav(); renderDetail();
</script>
